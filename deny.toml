# cargo-deny 配置 — `cargo deny check` 按此校验 漏洞/许可证/禁用源/重复依赖。
# 完整字段见: https://embarkstudios.github.io/cargo-deny/

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
# 2026-10-17 复核恢复 "deny"：zip 8.6.0 在 crates.io API（/api/v1/crates/zip/8.6.0）
# 与本地稀疏索引中均为 yanked=false，此前记录的「8.5.x/8.6.x 全 yank」不可复现，
# 降级前提不成立；全锁 735 条无 yanked 条目，cargo deny 通过。
yanked = "deny"
# 本文件是 advisory 忽略清单的单一事实源：CI 的 audit-check ignore 由本文件
# grep 生成（ci.yml security job），`.cargo/audit.toml` 为同步镜像（cargo-audit
# 只加载该路径或 ~/.cargo/audit.toml，仓库根目录同名文件不会被读取）。
# 约束：下方注释只允许出现被 ignore 的 RUSTSEC 编号（会被 grep 命中）。
# 每条 ignore 必须带"复核日期"，到期重新评估是否仍需忽略。
# 临时接受（最近复核 2026-10-16，基于 Cargo.lock 实锁版本）：
# - paste RUSTSEC-2024-0436 (unmaintained)：tokenizers 间接依赖（paste 1.0.15，
#   vecboost/candle 树仍在使用），无安全升级路径。复核：2026-12。
# - unsafe-libyaml RUSTSEC-2024-0449 (unmaintained)：limiteron 0.3.0-rc.7 间接
#   依赖（serde_yaml_ng 0.10），实证仍传递该依赖，无安全升级路径。复核：2026-12，
#   待 limiteron 移除 serde_yaml_ng 后移除。
# - number_prefix RUSTSEC-2025-0119 (unmaintained)：indicatif（vecboost/candle
#   进度条树）0.4.0 间接依赖，无安全升级路径。复核：2026-12，随 vecboost
#   上游更换进度条或发布新版后复评。
# 历史项复核结论（2026-10-16 移除）：cxx 与 event-listener 两条 unsound
# advisory 的锁内实版均已达到各自 patched 下限，advisory 不再命中，对应
# ignore 已删（编号见本文件 git 历史，注释约束不允许在此复述）。
# - zip RUSTSEC-2026-0367 / RUSTSEC-2026-0368 / RUSTSEC-2026-0369 (vulnerability，
#   ZipArchive::extract 的 SUID 保留 / 符号链接逃逸 / 经符号链接提权)：candle-core
#   0.11 钉死 zip 8.6.0（约束 ^8.6.0 不含修复所在的 9.0.x 大版本，锁内无可更
#   目标；zip 8.6.0 本身未被 yank，2026-10-17 复核）；漏洞面在 extract() 落盘
#   提取，本仓与 candle 仅随机读取、从不调用 extract()，实际不可达。
#   复核：随 candle-core 升级 zip 9.x 后移除。
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2024-0449",
    "RUSTSEC-2025-0119",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
# 允许的宽松许可证；新增非宽松许可证需在此放行
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause", "BSD-2-Clause", "ISC",
    "Unicode-3.0",
    "Zlib", "CC0-1.0", "MPL-2.0",
    # webpki-roots / webpki-root-certs (TLS 根证书库) 使用此数据许可
    "CDLA-Permissive-2.0",
    # xxhash-rust（经 oxcache 0.5.0-rc.6 可选 redis 后端进入 Cargo.lock 的
    # 传递依赖；OSI/FSF 认可的宽松许可，redis 特性本仓未启用）
    "BSL-1.0",
]
confidence-threshold = 0.8

# 自研基础库 RC 版本发布时 manifest 漏写 license 字段（base 工作区 LICENSE 实证均为 MIT）。
# 带 version 限定：base 库补发 license 字段的正式版不受此影响，届时可移除这些 clarify。
[[licenses.clarify]]
name = "trait-kit"
version = "0.5.0-rc.2"
license-files = []
expression = "MIT"

[[licenses.clarify]]
name = "sdforge"
version = "0.5.0-rc.2"
license-files = []
expression = "MIT"

[[licenses.clarify]]
name = "sdforge-macros"
version = "0.5.0-rc.2"
license-files = []
expression = "MIT"

[[licenses.clarify]]
name = "oxcache"
version = "0.5.0-rc.2"
license-files = []
expression = "MIT"

[[licenses.clarify]]
name = "oxcache_macros"
version = "0.5.0-rc.2"
license-files = []
expression = "MIT"

[[licenses.clarify]]
name = "inklog"
version = "0.3.0-rc.2"
license-files = []
expression = "MIT"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
