# cargo-deny 配置 — `cargo deny check` 按此校验 漏洞/许可证/禁用源/重复依赖。
# 完整字段见: https://embarkstudios.github.io/cargo-deny/

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# 本文件是 advisory 忽略清单的单一事实源：CI 的 audit-check ignore 由本文件
# grep 生成（ci.yml security job），audit.toml 为同步镜像。
# 约束：下方注释只允许出现被 ignore 的 RUSTSEC 编号（会被 grep 命中）。
# 每条 ignore 必须带"复核日期"，到期重新评估是否仍需忽略。
# 临时接受（最近复核 2026-09-16，基于 Cargo.lock 实锁版本）：
# - cxx RUSTSEC-2026-0202 (unsound)：lbug 0.20.4 传递锁定 cxx 1.0.202，
#   待 lbug 放宽约束升级到修复版后移除。复核：随 lbug 升级。
# - paste RUSTSEC-2024-0436 (unmaintained)：tokenizers 间接依赖（paste 1.0.15），
#   无安全升级路径。复核：2026-12。
# - event-listener RUSTSEC-2026-0221 (unsound)：smol-rs 间接依赖（5.4.2），
#   待上游发布修复版后升级移除。复核：2026-12。
ignore = [
    "RUSTSEC-2026-0202",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0221",
]

[licenses]
# 允许的宽松许可证；新增非宽松许可证需在此放行
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause", "BSD-2-Clause", "ISC",
    "Unicode-3.0", "Unicode-DFS-2016",
    "Zlib", "CC0-1.0", "MPL-2.0",
    # webpki-roots / webpki-root-certs (TLS 根证书库) 使用此数据许可
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# 自研基础库 RC 版本发布时 manifest 漏写 license 字段（base 工作区 LICENSE 实证均为 MIT）。
# 带 version 限定：base 库补发 license 字段的正式版不受此影响，届时可移除这些 clarify。
[[licenses.clarify]]
name = "trait-kit"
version = "0.5.0-rc.2"
license-files = []
expression = "MIT"

[[licenses.clarify]]
name = "sdforge"
version = "0.5.0-rc.2"
license-files = []
expression = "MIT"

[[licenses.clarify]]
name = "sdforge-macros"
version = "0.5.0-rc.2"
license-files = []
expression = "MIT"

[[licenses.clarify]]
name = "oxcache"
version = "0.5.0-rc.2"
license-files = []
expression = "MIT"

[[licenses.clarify]]
name = "oxcache_macros"
version = "0.5.0-rc.2"
license-files = []
expression = "MIT"

[[licenses.clarify]]
name = "inklog"
version = "0.3.0-rc.2"
license-files = []
expression = "MIT"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
