# cargo-audit 配置 — `cargo audit`（本地运行）按此校验 RUSTSEC 漏洞。
#
# 注意：忽略清单的单一事实源是 deny.toml（CI audit-check 从它 grep 生成），
# 本文件是其同步镜像；修改忽略项时两处必须一起改，并在 deny.toml 注释里
# 更新复核日期。
[advisories]
ignore = [
    "RUSTSEC-2026-0202", # cxx unsound：lbug 0.20.4 传递锁定 cxx 1.0.202，待 lbug 放宽约束
    "RUSTSEC-2024-0436", # paste unmaintained：tokenizers 间接依赖，无升级路径
    "RUSTSEC-2026-0221", # event-listener unsound：smol-rs 间接依赖 5.4.2，待上游修复
]
