# cargo-audit 配置 — `cargo audit`（本地运行）按此校验 RUSTSEC 漏洞。
#
# 位置约束：cargo-audit 0.22 只读 `./.cargo/audit.toml` 或 `~/.cargo/audit.toml`，
# 仓库根目录的同名文件不会被加载（曾因此使本地 `cargo audit` 对已 ignore 的
# advisory 仍报错）。本文件必须留在 `.cargo/` 下。
#
# 注意：忽略清单的单一事实源是 deny.toml（CI audit-check 从它 grep 生成），
# 本文件是其同步镜像；修改忽略项时两处必须一起改，并在 deny.toml 注释里
# 更新复核日期。
[advisories]
# 2026-11-12 复核：rmcp 3.8.0 → 3.9.0（RUSTSEC-2026-0462 修复版）已随升级
# 出清；新增 libsqlite3-sys RUSTSEC-2026-0459 登记（上游 sqlx-sqlite 0.9.0
# 硬帽 <0.38.0，修复版不可达，详见 deny.toml 单一事实源）。
ignore = [
    "RUSTSEC-2024-0436", # paste unmaintained：tokenizers 间接依赖（vecboost 树），无升级路径
    "RUSTSEC-2025-0119", # number_prefix unmaintained：indicatif（vecboost 树）间接依赖，无升级路径
    "RUSTSEC-2026-0459", # libsqlite3-sys CVE-2026-119375：sqlx-sqlite 0.9.0 硬帽 <0.38.0，修复版不可达
]
