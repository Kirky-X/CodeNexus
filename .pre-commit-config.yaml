# Pre-commit hooks for CodeNexus
# Install: pip install pre-commit && pre-commit install
# Docs: https://pre-commit.com/
default_install_hook_types: [pre-commit, pre-push]
repos:
  # 1. Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # fuzz 语料是二进制回归输入，按文本规则改写会污染用例字节
        exclude: '^fuzz/corpus/'
      - id: end-of-file-fixer
        exclude: '^fuzz/corpus/'
      - id: check-yaml
        exclude: '^fuzz/corpus/'
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: detect-private-key
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: '^fuzz/corpus/'

  # 2. Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: '^Cargo\.lock$|^skills-lock\.json$|^\.qoder/skills/design/|^\.agents/skills/'

  # 3. Rust formatting and checks
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Format Rust code
        description: Check Rust formatting with rustfmt
        entry: cargo +nightly fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        entry: cargo check --lib
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --lib
        language: system
        types: [rust]
        pass_filenames: false
        args: ['--', '-D', 'warnings']
      - id: cargo-test
        name: cargo test
        entry: cargo test --lib --quiet
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-coverage
        name: cargo coverage (≥95%)
        entry: bash -c 'cargo llvm-cov --lib --fail-under-lines 95 --quiet 2>/dev/null || { echo "→ 先运行 cargo install cargo-llvm-cov"; exit 1; }'
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-audit
        name: cargo audit (RustSec 漏洞库)
        # 忽略清单不再内联（曾与 deny.toml 漂移且 CLI --ignore 会整体覆盖配置）：cargo audit 读 .cargo/audit.toml（deny.toml 的同步镜像）。
        entry: bash -c 'cargo audit 2>/dev/null || cargo audit --no-fetch || { echo "→ cargo audit 失败：存在未忽略的漏洞，或未安装 cargo-audit（cargo install cargo-audit）"; exit 1; }'
        language: system
        files: 'Cargo\.lock'
        pass_filenames: false
      - id: cargo-deny
        name: cargo deny check (license/advisory/ban)
        entry: bash -c 'cargo deny check 2>/dev/null || { echo "→ 先运行 cargo install cargo-deny && cargo deny init"; exit 1; }'
        language: system
        files: 'Cargo\.(toml|lock)'
        pass_filenames: false

  # === 提交完成后清理本地编译产物（post-commit 阶段；启用: pre-commit install -t post-commit） ===
  - repo: local
    hooks:
      - id: post-commit-clean
        name: clean local build artifacts (cargo target + python)
        entry: >-
          bash -c 'cargo clean >/dev/null 2>&1;
          find . \( -name node_modules -o -name .venv \) -prune -o -type d -name target -prune -exec rm -rf {} +;
          find . \( -name node_modules -o -name .venv \) -prune -o -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache -o -name .hypothesis -o -name "*.egg-info" \) -prune -exec rm -rf {} +;
          find . \( -name node_modules -o -name .venv \) -prune -o -type f \( -name "*.pyc" -o -name "*.pyo" \) -exec rm -f {} +;
          if [ -z "$(git ls-files build dist)" ]; then rm -rf build dist; fi;
          echo "[post-commit] 已清理 cargo target 与 Python 编译产物"'
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-commit]
ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"

# 全局阶段约束
default_stages: [pre-commit]  # 锁定未显式声明 stages 的 hook，避免污染 post-commit 等阶段
