name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Toolchain version must match the declared MSRV (Cargo.toml
      # `rust-version` / clippy.toml `msrv`) — this job is what verifies it.
      - name: Install Rust 1.97.1 with clippy
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.1"
          components: clippy
      - name: Install nightly toolchain with rustfmt
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          components: rustfmt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check
      - name: Clippy (full)
        run: cargo +1.97.1 clippy -- -D warnings
      - name: Clippy (minimal)
        run: cargo +1.97.1 clippy --lib --no-default-features --features minimal -- -D warnings
      # 2026-09-19 审计补腿：examples 是 workspace 成员但此前从未进 CI
      - name: Check examples crate
        run: cargo +1.97.1 check -p codenexus-examples --all-targets
      # webui（opt-in，不入 full）：CI 无 graph-viewer/dist 产物，
      # 该腿同时验证 rust-embed allow_missing 回退路径可编译。
      - name: Check webui feature (no dist fallback)
        run: cargo +1.97.1 check --features webui
      - name: Clippy (webui)
        run: cargo +1.97.1 clippy --features webui -- -D warnings

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: "minimal"
            cache-key: "minimal"
          - features: "core"
            cache-key: "core"
          - features: "full"
            cache-key: "full"
          - features: "core,daemon,analysis,complexity"
            cache-key: "core-daemon-analysis-complexity"
          - features: "core,lsp,cache"
            cache-key: "core-lsp-cache"
          - features: "full,embeddings"
            cache-key: "full-embeddings"
          # webui（opt-in）：viewer 单测/鉴权矩阵/e2e 在 CI 有真实执行面
          # （无 dist 时静态断言走回退页分支，仍覆盖鉴权与 Host 校验）。
          - features: "full,webui"
            cache-key: "full-webui"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.97.1 (declared MSRV)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.1"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.cache-key }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Tests
        # --quiet：逐测试行打印在 4676+ 测试规模下使单步 stdout 达 ~370KB，
        # 超门禁单流 256KB 上限；quiet 模式只输出进度点与 test result 摘要
        # （失败时仍有完整 panic 输出，失败检测不降级）。
        run: |
          if [ "${{ matrix.features }}" = "full" ]; then
            cargo test --lib --quiet
            # Integration tests (tests/*.rs: CLI, daemon lifecycle, MCP
            # protocol, non-ASCII paths) must gate merges too — they cover
            # paths the lib-only suite never touches.
            cargo test --tests --features full --quiet
          else
            cargo test --lib --no-default-features --features "${{ matrix.features }}" --quiet
          fi

  coverage:
    name: coverage (≥95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.97.1 (declared MSRV)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.1"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Coverage (fail under 95% lines, default features)
        # cargo 级 --quiet 把构建进度与内层逐测试输出一并压成进度点（原始 358KB
        # 超 CI 日志单流 256KB 上限）；llvm-cov 文本表仍完整打印到 stdout，含
        # TOTAL 汇总行。注：cargo 会把 --quiet 转发给 libtest，故不能写成
        # `-- --quiet`（仓库 .cargo/config.toml 的 [term] quiet 已使其变成重复
        # 旗标，实测报 "Option 'quiet' given more than once" 直接失败）。
        # 注：--summary-only/--lcov 组合经实测（cargo-llvm-cov 0.9.1）会抑制
        # stdout 汇总表，故不用；lcov.info 产物随之移除（见 Upload 步骤删除）。
        run: cargo llvm-cov --lib --fail-under-lines 95 --quiet

  fuzz-smoke:
    name: fuzz smoke (build + short run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-fuzz requires nightly (sanitizer) + rust-src (build-std).
      - name: Install nightly with rust-src
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
          components: rust-src
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      # 显式指定 host gnu target：cargo-fuzz 0.14 起 Linux 默认改用 musl
      # (rust-fuzz/cargo-fuzz#398)，musl 静态 libc 与 sanitizer 不兼容
      # （"sanitizer is incompatible with statically linked libc" + E0463）。
      - name: Build all fuzz targets
        working-directory: fuzz
        run: cargo fuzz build --target x86_64-unknown-linux-gnu
      - name: Short run per target (smoke, not a corpus campaign)
        working-directory: fuzz
        run: |
          for t in escape_cypher_string escape_identifier cypher_subset_parse cnxp_header; do
            cargo fuzz run "$t" --target x86_64-unknown-linux-gnu -- -runs=2000 -max_total_time=60
          done

  security:
    name: cargo-audit + cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # deny.toml is the single source of truth for advisory ignores
      # (.cargo/audit.toml is the synced mirror for local `cargo audit` runs;
      # audit-check cannot read config files, so the ignore list is derived
      # here and can never drift again).
      # Constraint: deny.toml comments must only mention RUSTSEC IDs that are
      # actually ignored.
      - name: Derive advisory ignores from deny.toml
        id: audit_ignore
        run: echo "ids=$(grep -oE 'RUSTSEC-[0-9]{4}-[0-9]+' deny.toml | sort -u | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - name: cargo-audit (RustSec 漏洞库)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: ${{ steps.audit_ignore.outputs.ids }}
      - name: cargo-deny (license / ban / advisory)
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
      # 工作流注入面：inputs/github 事件上下文直插 run 块是经典 CI 注入向量。
      # 与本地 tiangang(semgrep) 同规则集；版本随工具链评审 bump。
      - name: semgrep (GitHub Actions 工作流注入扫描)
        run: |
          pip install -q "semgrep==1.181.0"
          semgrep --config p/github-actions --metrics=off --error .github/
