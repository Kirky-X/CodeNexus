# Release workflow — creates a GitHub Release when a `v*` tag is pushed.
# GitHub auto-attaches the source archives (Source code zip/tar.gz) for the
# tag. If CARGO_REGISTRY_TOKEN is set, also publishes to crates.io.
#
# Trigger:  git tag v0.3.3 && git push origin v0.3.3

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.97.1 (declared MSRV)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.1"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler


      - name: Verify build
        run: cargo build --release --lib

      # semver 预发布段（-rc.N 等）→ GitHub prerelease 标记；rc 不得抢占 Latest。
      # 仅 tag 推送有版本串可派生；手动触发（分支 ref）不标记，维持原行为。
      - name: Derive prerelease flag
        id: meta
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.PRERELEASE }}

      # 注意:step 级 if 里取不到 secrets/env 上下文中的 secret,原写法恒为 false
      # 导致发布被静默跳过。secret 经 job env 注入,步骤无条件执行,publish 失败即红。
      # 幂等:已发布版本直接跳过,避免"已存在"报错误伤重跑

      - name: Verify release uniqueness (idempotency guard)
        # 断言只对 tag 推送路径生效：手动触发（分支 ref）无版本 tag 可断言
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          echo "release objects for ${TAG}: ${COUNT}"
          if [ "${COUNT}" != "1" ]; then
            echo "::error::expected exactly 1 release for ${TAG}, found ${COUNT}; release state is not idempotent"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check already published
        id: published
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="codenexus") | .version')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
            "https://crates.io/api/v1/crates/codenexus/${VERSION}")
          echo "codenexus ${VERSION}: HTTP ${CODE}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "exists=$([[ "$CODE" == "200" ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      # 带 [patch.crates-io] 时禁止发布:patch 不随发布物分发,下游会解析到
      # crates.io 的 vecboost 0.3.0-rc.1(编译失败),发布物与 CI 被测版本不一致。
      # 上游修复版发布后删除 Cargo.toml 的 patch 段,本步骤自然通过。
      - name: Guard against active patch.crates-io before publish
        if: steps.published.outputs.exists == 'false'
        run: |
          if grep -qE '^\[patch\.crates-io\]' Cargo.toml; then
            echo "::error::Cargo.toml 含生效的 [patch.crates-io]:发布物对下游消费者不含该 patch,将解析到编译失败的 crates.io vecboost。请先在上游发布修复版并移除 patch 段。"
            exit 1
          fi

      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        # No --no-verify: publish-time verification catches dev-dependency /
        # doctest / feature-matrix breakage, which a multi-feature crate like
        # this one is most exposed to — and a bad publish cannot be undone.
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # crates.io 版本硬校验:防止任何形式的静默漏发
      - name: Verify on crates.io
        if: always()
        run: |
          VERSION=${{ steps.published.outputs.version }}
          for i in 1 2 3 4 5; do
            sleep 20
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
              "https://crates.io/api/v1/crates/codenexus/${VERSION}")
            echo "try$i: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then exit 0; fi
            if [ "$CODE" != "403" ]; then break; fi
          done
          echo "::error::codenexus ${VERSION} 未出现在 crates.io(HTTP ${CODE})"
          exit 1
