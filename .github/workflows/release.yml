# Release workflow — creates a GitHub Release when a `v*` tag is pushed.
# GitHub auto-attaches the source archives (Source code zip/tar.gz) for the
# tag. If CARGO_REGISTRY_TOKEN is set, also publishes to crates.io.
#
# Trigger:  git tag v0.3.3 && git push origin v0.3.3

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.97.1 (declared MSRV)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.1"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      # [patch.crates-io] points the four base libraries at ../base/* for
      # local development (CI lint/test jobs clone them there). A release
      # must resolve from the REGISTRY instead — that is exactly what users
      # will build against — and the runner has no ../base anyway. Strip the
      # whole patch section (it is the final section of the manifest) before
      # building/publishing; Cargo re-resolves the deps from crates.io and
      # updates Cargo.lock accordingly.
      - name: Disable local base patches (publish resolves from crates.io)
        run: |
          python3 - << 'PY'
          from pathlib import Path
          manifest = Path("Cargo.toml")
          text = manifest.read_text()
          idx = text.index("[patch.crates-io]")
          manifest.write_text(text[:idx].rstrip() + "\n")
          PY
          grep -c "patch.crates-io" Cargo.toml || echo "patch section removed"

      - name: Verify build
        run: cargo build --release --lib

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        # No --no-verify: publish-time verification catches dev-dependency /
        # doctest / feature-matrix breakage, which a multi-feature crate like
        # this one is most exposed to — and a bad publish cannot be undone.
        run: cargo publish
