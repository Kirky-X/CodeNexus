# Release workflow — creates a GitHub Release when a `v*` tag is pushed.
# GitHub auto-attaches the source archives (Source code zip/tar.gz) for the
# tag. If CARGO_REGISTRY_TOKEN is set, also publishes to crates.io.
#
# Trigger:  git tag v0.3.3 && git push origin v0.3.3

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.97.1 (declared MSRV)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.1"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      - name: Verify build
        run: cargo build --release --lib

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

      # 注意:step 级 if 里取不到 secrets/env 上下文中的 secret,原写法恒为 false
      # 导致发布被静默跳过。secret 经 job env 注入,步骤无条件执行,publish 失败即红。
      - name: Publish to crates.io
        # No --no-verify: publish-time verification catches dev-dependency /
        # doctest / feature-matrix breakage, which a multi-feature crate like
        # this one is most exposed to — and a bad publish cannot be undone.
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # crates.io 版本硬校验:防止任何形式的静默漏发
      - name: Verify on crates.io
        run: |
          for i in 1 2 3 4 5; do
            sleep 20
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
              "https://crates.io/api/v1/crates/codenexus/0.3.13-rc.1")
            echo "try$i: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then exit 0; fi
            if [ "$CODE" != "403" ]; then break; fi
          done
          echo "::error::codenexus 0.3.13-rc.1 未出现在 crates.io(HTTP ${CODE})"
          exit 1
