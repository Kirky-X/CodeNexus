# Release workflow — creates a GitHub Release when a `v*` tag is pushed.
# GitHub auto-attaches the source archives (Source code zip/tar.gz) for the
# tag. Publishes to crates.io via OIDC trusted publishing (crates-io-auth-action).
#
# Trigger:  git tag v0.3.3 && git push origin v0.3.3

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# id-token: write：crates.io trusted publishing（OIDC）换取短时发布凭证
permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1 (declared MSRV)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.1"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler


      - name: Verify build
        run: cargo build --release --lib

      # semver 预发布段（-rc.N 等）→ GitHub prerelease 标记；rc 不得抢占 Latest。
      # zizmor superfluous-actions（2026-11-14，zizmor 1.32 起该 finding 随
      # SARIF 入 code-scanning）：action-gh-release 的能力 runner 自带 gh CLI
      # 已覆盖，按 zizmor 建议换脚本步直建。行为对齐原 action：
      # --generate-notes 对齐 generate_release_notes、draft 缺省即 false、
      # semver 含预发布段时加 --prerelease。tag 推送与手动触发（workflow_dispatch）
      # 均可派生 tag：dispatch 无版本 tag，按 sdforge 先例从 cargo metadata
      # 的 crate 版本反推（v<version>）。幂等：release 已存在则跳过创建，
      # 配合下方 uniqueness 断言重跑安全。PRERELEASE/TAG 均不经 template
      # 直插 run 块（template-injection 向量，zizmor 告警 #8 同因）。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="codenexus") | .version')"
          fi
          VERSION="${TAG#v}"
          ARGS=(--generate-notes)
          if [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; skip creation (idempotent)"
            exit 0
          fi
          gh release create "$TAG" "${ARGS[@]}"

      # 注意:step 级 if 里取不到 secrets 上下文中的 secret,原写法恒为 false
      # 导致发布被静默跳过。现发布凭证由 OIDC auth-action 步提供,与 secret 无关。
      # 幂等:已发布版本直接跳过,避免"已存在"报错误伤重跑

      - name: Verify release uniqueness (idempotency guard)
        # 断言只对 tag 推送路径生效：手动触发（分支 ref）无版本 tag 可断言
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # gh release create 落库有最终一致性窗口：创建成功后立刻列表可能读
          # 到 0（v0.4.0 attempt1 实录：19:11:24 创建返回 URL，19:11:26 列表
          # 读 0 致 uniqueness 失败、publish 被跳过，--failed 重跑恢复）。
          # 轮询 5 次 × 3s，读到 1 即过；持续非 1 才判失败。
          COUNT=0
          for i in 1 2 3 4 5; do
            COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
            echo "try${i}: release objects for ${TAG}: ${COUNT}"
            if [ "${COUNT}" = "1" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::expected exactly 1 release for ${TAG}, found ${COUNT} after 5 retries; release state is not idempotent"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check already published
        id: published
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="codenexus") | .version')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
            "https://crates.io/api/v1/crates/codenexus/${VERSION}")
          echo "codenexus ${VERSION}: HTTP ${CODE}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "exists=$([[ "$CODE" == "200" ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      # 带 [patch.crates-io] 时禁止发布:patch 不随发布物分发,下游会解析到
      # crates.io 的 vecboost 0.3.0-rc.1(编译失败),发布物与 CI 被测版本不一致。
      # 上游修复版发布后删除 Cargo.toml 的 patch 段,本步骤自然通过。
      - name: Guard against active patch.crates-io before publish
        if: steps.published.outputs.exists == 'false'
        run: |
          if grep -qE '^\[patch\.crates-io\]' Cargo.toml; then
            echo "::error::Cargo.toml 含生效的 [patch.crates-io]:发布物对下游消费者不含该 patch,将解析到编译失败的 crates.io vecboost。请先在上游发布修复版并移除 patch 段。"
            exit 1
          fi

      # crates.io trusted publishing（OIDC）：官方 auth-action 以 Actions OIDC 换取短时发布凭证
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
        id: auth

      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        # No --no-verify: publish-time verification catches dev-dependency /
        # doctest / feature-matrix breakage, which a multi-feature crate like
        # this one is most exposed to — and a bad publish cannot be undone.
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # crates.io 版本硬校验:防止任何形式的静默漏发
      - name: Verify on crates.io
        if: always()
        env:
          # 经 env 传值而非直插 run 块：`${{ }}` 直接展开到 shell 是经典工作流注入
          # 向量（zizmor template-injection 告警 #8）。
          VERSION: ${{ steps.published.outputs.version }}
        run: |
          for i in 1 2 3 4 5; do
            sleep 20
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
              "https://crates.io/api/v1/crates/codenexus/${VERSION}")
            echo "try$i: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then exit 0; fi
            if [ "$CODE" != "403" ]; then break; fi
          done
          echo "::error::codenexus ${VERSION} 未出现在 crates.io(HTTP ${CODE})"
          exit 1
