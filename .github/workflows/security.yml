# 安全检查补充 workflow
# 由统一护栏配置生成（2026-10-20）。只包含本仓现有 CI 尚未覆盖的检查，
# 不改动既有 workflow，避免与已有 job 重复。
name: security
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      # gitleaks 需要全量提交历史：浅克隆（默认 depth=1）下 action 算出的
      # `<head>^..<head>` 区间取不到父提交，gitleaks 会以
      # "fatal: ambiguous argument ... unknown revision" + Unexpected exit code [1] 退出，
      # 密钥扫描实际空转（同族 CalNexus run 39473509412 即此原因）。
      # 写法对齐 vecboost 仓同一 workflow：SHA 钉 + fetch-depth: 0，顺带消除
      # @v4 的 Node.js 20 弃用告警与 zizmor 的 unpinned-uses。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          # shellcheck 子检查降到 error 级：YAML 语法/表达式错误仍阻断，
          # 风格级（SC2086/SC2034 等）不阻断，避免打断既有流水线。
          args: -color -shellcheck=error
      - name: zizmor (GitHub Actions 安全审计)
        # 首轮为非阻断基线：既有 workflow 存在一批 unpinned-uses / cache-poisoning /
        # template-injection 发现，阻断式会直接打断现有流水线。backlog 清零后
        # 把 continue-on-error 删掉即可转为阻断。
        continue-on-error: true
        # 版本修正（外部事实）：`v0.12.0` 在 zizmorcore/zizmor-action 仓库不存在
        # （API tags 最高为 v0.7.1）。引用不存在的 action 会在 job 解析下载清单阶段
        # （"Getting action download info" / "Set up job"）就直接失败，continue-on-error
        # 也救不回来——同族 NebulaId run 39447128551、CalNexus 与 garrison 均因此长红。
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
      - name: gitleaks 密钥扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      # 不引入 cargo-vet：依赖来源审计由 ci.yml 已有的 "cargo-audit + cargo-deny" 作业
      # （ci.yml:176，配 EmbarkStudios/cargo-deny-action 与 .cargo/audit.toml）承担；
      # cargo-vet 需要 supply-chain/ 配置并逐 crate 录入审计依据，本仓未提供且 600+
      # 依赖无法在此补齐，`cargo vet verify` 是从第一天起就必失败的空转门禁。
      # 处理方式与本工作区 vecboost/CalNexus/NebulaId 的同一 workflow 一致。
      - name: trivy (文件系统/依赖漏洞)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
