# 安全检查补充 workflow
# 由统一护栏配置生成（2026-10-20）。只包含本仓现有 CI 尚未覆盖的检查，
# 不改动既有 workflow，避免与已有 job 重复。
name: security
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # zizmor 通过 codeql-action/upload-sarif 上传结果；缺此权限时
  # upload-sarif 以 "This run of the CodeQL Action does not have permission to
  # access the CodeQL Action API endpoints ... at least 'security-events: read'"
  # 失败（run 41364242434 实证）。
  security-events: write

concurrency:
  # 同分支重复触发时取消上一次：安全扫描每次都要全量 clone（fetch-depth: 0），
  # 并发堆积会长时间占用 runner。
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # gitleaks 需要全量提交历史：浅克隆（默认 depth=1）下 action 算出的
      # `<head>^..<head>` 区间取不到父提交，gitleaks 会以
      # "fatal: ambiguous argument ... unknown revision" + Unexpected exit code [1] 退出，
      # 密钥扫描实际空转（同族 CalNexus run 39473509412 即此原因）。
      # 写法对齐 vecboost 仓同一 workflow：SHA 钉 + fetch-depth: 0，顺带消除
      # @v4 的 Node.js 20 弃用告警与 zizmor 的 unpinned-uses。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: actionlint
        # 第三方 docker action 钉具体版本：latest 可变，上游可静默换镜像。
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # shellcheck 子检查降到 error 级：YAML 语法/表达式错误仍阻断，
          # 风格级（SC2086/SC2034 等）不阻断，避免打断既有流水线。
          args: -color -shellcheck=error
      - name: zizmor (GitHub Actions 安全审计)
        # 阻断式（2026-10-28 转）：本地 zizmor v1.31.1 全量扫 .github/workflows/
        # 结果为 0 low / 0 medium / 0 high（仅 2 条 info：template-injection 的低置信
        # 版本号插值与 softprops action 的 superfluous-actions 建议），backlog 已清零，
        # 故移除 continue-on-error 让审计发现真正阻断。
        # 版本：v0.8.0（与 garrison 同 SHA）。v0.7.1 在 GitHub Actions 环境下
        # 做 impostor-commit 审计时以 "Resource not accessible by integration"
        # 整步失败（run 41363569435 实证，补 GH_TOKEN 后仍复现），v0.8.0 起同
        # workflow 在 garrison 稳定通过。
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        env:
          # impostor-commit 审计需要 GitHub API 校验 SHA 归属；缺 token 时
          # 上游报 "fast path impostor check failed ... request error" 后整步
          # 以 "Resource not accessible by integration" 失败（run 41362793119）。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: gitleaks 密钥扫描
        # 第三方 action 钉 SHA：@v2 可变 tag，上游可重指。
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      # 不引入 cargo-vet：依赖来源审计由 ci.yml 已有的 "cargo-audit + cargo-deny" 作业
      # （ci.yml:176，配 EmbarkStudios/cargo-deny-action 与 .cargo/audit.toml）承担；
      # cargo-vet 需要 supply-chain/ 配置并逐 crate 录入审计依据，本仓未提供且 600+
      # 依赖无法在此补齐，`cargo vet verify` 是从第一天起就必失败的空转门禁。
      # 处理方式与本工作区 vecboost/CalNexus/NebulaId 的同一 workflow 一致。
      - name: trivy (文件系统/依赖漏洞)
        # 同上：@master 是可变分支，钉 v0.36.0。
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
