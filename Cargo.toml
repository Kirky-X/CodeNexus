[package]
name = "codenexus"
version = "0.4.0-rc.3"
edition = "2021"
rust-version = "1.97.1"
description = "A queryable code knowledge graph tool built on LadybugDB and tree-sitter"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "MIT"
repository = "https://github.com/Kirky-X/codenexus"
readme = "README.md"
keywords = ["code-analysis", "knowledge-graph", "tree-sitter", "ladybugdb", "code-indexing"]
categories = ["command-line-utilities", "development-tools", "parsing"]
homepage = "https://github.com/Kirky-X/codenexus"
documentation = "https://github.com/Kirky-X/codenexus#readme"
build = "build.rs"

[lib]
name = "codenexus"
path = "src/lib.rs"

[[bin]]
name = "codenexus"
path = "src/main.rs"
# 主 bin 使用 cli 门控的 sdforge/clap——声明 required-features 使
# minimal 等无 cli 组合跳过 bin 编译（此前为 26 个 unresolved 错误）。
required-features = ["cli"]

[[bin]]
name = "cn"
path = "src/main.rs"
# `cn` 是 `codenexus` 的等形态别名命令（同一源、同一 CLI 面）。
required-features = ["cli"]

# 原 `[[bin]] codenexus-verify`（path=tools/verification/src/main.rs，违规
# 自定义路径形态）已折叠为主 CLI 的 `verify` 子命令：实现整体迁入库侧
# `src/verify/`（orchestrator + 统计/客户端/查询比对/报告/类型映射），
# 入口经 sdforge inventory 注册（src/verify/mod.rs）。数据文件
# （samples.json / type_map.json / queries/ / fetch_samples.sh）保留在
# tools/verification/ 不动。

[features]
default = ["full"]
minimal = ["lang-rust"]
core = ["lang-c", "lang-rust", "lang-python"]
full = ["core", "lang-fortran", "lang-typescript", "lang-go", "lang-java", "lang-cpp", "lang-javascript", "lang-ruby", "lang-haskell", "lang-ocaml", "lang-scala", "lang-php", "lang-csharp", "lang-bash", "lang-html", "lang-css", "lang-json", "lang-regex", "lang-verilog", "lang-swift", "daemon", "analysis", "complexity", "api-review", "community", "cross-service", "diagram", "lsp", "cli", "mcp", "cache", "embeddings", "i18n", "hub"]
lang-c = ["dep:tree-sitter-c"]
lang-rust = ["dep:tree-sitter-rust"]
lang-fortran = ["dep:tree-sitter-fortran"]
lang-python = ["dep:tree-sitter-python"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-ruby = ["dep:tree-sitter-ruby"]
lang-haskell = ["dep:tree-sitter-haskell"]
lang-ocaml = ["dep:tree-sitter-ocaml"]
lang-scala = ["dep:tree-sitter-scala"]
lang-php = ["dep:tree-sitter-php"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-bash = ["dep:tree-sitter-bash"]
lang-html = ["dep:tree-sitter-html"]
lang-css = ["dep:tree-sitter-css"]
lang-json = ["dep:tree-sitter-json"]
lang-regex = ["dep:tree-sitter-regex"]
lang-verilog = ["dep:tree-sitter-verilog"]
lang-swift = ["dep:tree-sitter-swift"]
# 向量嵌入（ML embeddings，vecboost/candle）；原名单 `embed` 易与 no-std 语境的 embedded 混淆
embeddings = ["dep:reqwest", "dep:vecboost"]
daemon = ["dep:notify", "dep:notify-debouncer-full", "dep:signal-hook"]
analysis = []
api-review = ["analysis"]
community = ["analysis", "dep:petgraph"]
cross-service = ["analysis"]
complexity = ["analysis"]
diagram = ["analysis"]
lsp = ["dep:lsp-types", "dep:lsp-server", "dep:crossbeam-channel", "dep:url"]
mcp = ["sdforge/mcp", "sdforge/inklog", "dep:oxiarc-zstd"]
cli = ["sdforge/cli", "sdforge/inklog", "dep:oxiarc-zstd"]
cache = ["dep:oxcache"]
i18n = ["dep:icu_normalizer", "dep:icu_casemap"]
hub = ["dep:reqwest"]
# 内嵌 graph-viewer Web UI（`codenexus webui`）；opt-in，默认构建不含
# graph-viewer 内嵌服务（见 feature `webui`）
webui = ["dep:axum", "dep:mime_guess", "dep:rust-embed", "tokio/net", "tokio/sync"]

[dependencies]
trait-kit = { version = "0.5.0-rc.14", default-features = false, features = ["async", "lifecycle", "health", "report", "shutdown"] }
lbug = { workspace = true }
tree-sitter = { version = "0.27", default-features = false, features = ["std"] }
tree-sitter-c = { version = "0.24", default-features = false, optional = true }
tree-sitter-rust = { version = "0.24", default-features = false, optional = true }
tree-sitter-fortran = { version = "0.6", default-features = false, optional = true }
tree-sitter-python = { version = "0.25", default-features = false, optional = true }
tree-sitter-typescript = { version = "0.23", default-features = false, optional = true }
tree-sitter-go = { version = "0.25", default-features = false, optional = true }
tree-sitter-java = { version = "0.23", default-features = false, optional = true }
tree-sitter-cpp = { version = "0.23", default-features = false, optional = true }
tree-sitter-javascript = { version = "0.25", default-features = false, optional = true }
tree-sitter-ruby = { version = "0.23", default-features = false, optional = true }
tree-sitter-haskell = { version = "0.24", default-features = false, optional = true }
tree-sitter-ocaml = { version = "0.26", default-features = false, optional = true }
tree-sitter-scala = { version = "0.26", default-features = false, optional = true }
tree-sitter-php = { version = "0.25", default-features = false, optional = true }
tree-sitter-c-sharp = { version = "0.23", default-features = false, optional = true }
tree-sitter-bash = { version = "0.25", default-features = false, optional = true }
tree-sitter-html = { version = "0.23", default-features = false, optional = true }
tree-sitter-css = { version = "0.25", default-features = false, optional = true }
tree-sitter-json = { version = "0.24", default-features = false, optional = true }
tree-sitter-regex = { version = "0.25", default-features = false, optional = true }
tree-sitter-verilog = { version = "1.0", default-features = false, optional = true }
tree-sitter-swift = { version = "0.7", default-features = false, optional = true }
rayon = { version = "1.12", default-features = false }
ignore = { version = "0.4", default-features = false }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"], optional = true }
notify-debouncer-full = { version = "0.7", default-features = false, features = ["macos_fsevent"], optional = true }
signal-hook = { version = "0.4", default-features = false, features = ["channel", "iterator"], optional = true }
blake3 = { version = "1.8", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls"], optional = true }
vecboost = { version = "0.3.0-rc.3", default-features = false, optional = true }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
anyhow = { version = "1.0", default-features = false, features = ["std"] }
pest = { version = "2.9", default-features = false, features = ["std", "memchr"] }
pest_derive = { version = "2.9", default-features = false, features = ["std"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = { version = "1.4", default-features = false }
tempfile = { workspace = true }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
uuid = { version = "1.28", default-features = false, features = ["v7"] }
petgraph = { version = "0.8", default-features = false, optional = true }
lsp-types = { version = "0.97", default-features = false, optional = true }
lsp-server = { version = "0.10", default-features = false, optional = true }
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"], optional = true }
url = { version = "2.5", default-features = false, features = ["std"], optional = true }
# i18n 消息目录常编并转发 sdforge::i18n，故 sdforge 为常驻依赖
sdforge = { version = "0.5.0-rc.11", default-features = false, features = ["i18n"] }
limiteron = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
oxcache = { version = "0.5.0-rc.12", default-features = false, features = ["minimal", "macros"], optional = true }
oxiarc-zstd = { version = "0.4", default-features = false, optional = true }
# zstd-sys 显式钉 vendored：lbug bundled zstd 不再外泄符号，pkg-config 探测无法替代
zstd-sys = { version = "2.1", default-features = false, features = ["std", "vendored"] }
inklog = { workspace = true }
regex = { version = "1.13", default-features = false, features = ["std", "unicode", "perf"] }
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_casemap = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
# 消息级 i18n 常开：消息经 sdforge i18n 解析，unic-langid 仅用于语言探测链
unic-langid = { workspace = true }
sys-locale = { workspace = true }

# graph-viewer 内嵌服务（见 feature `viewer`）
axum = { workspace = true, optional = true }
mime_guess = { version = "2.0", default-features = false, optional = true }
# debug-embed 必须保留：缺失时 debug 构建按 CWD 运行时读盘，测试会静默落到回退页
rust-embed = { version = "8.13", default-features = false, features = ["include-exclude", "debug-embed"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["rayon", "plotters", "cargo_bench_support"] }
time = { version = "0.3", default-features = false, features = ["std", "macros"] }
rust_decimal = { version = "1.43", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serial_test = { version = "4.0", default-features = false, features = ["logging", "async"] }
oxiarc-zstd = { version = "0.4", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["smallvec", "fmt", "ansi", "tracing-log", "std"] }
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
# `#[forge::log]` 测试断言函数级日志；std 为 set_boxed_logger 所需
log = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
pkg-config = { version = "0.3", default-features = false }

[[bench]]
name = "index_bench"
harness = false

[[bench]]
name = "query_bench"
harness = false

[[bench]]
name = "trace_bench"
harness = false

[[bench]]
name = "incremental_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "daemon_bench"
harness = false
required-features = ["daemon"]

[[bench]]
name = "graph_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.release.package."*"]
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.test]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"

[lints.rust]
# 审计（2026-09-19）：lang-kotlin/solidity 死 cfg 已清理，从 allow 收紧为 warn 白名单
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("http", "openapi", "websocket", "streaming", "grpc", "docs", "cache", "health", "metrics", "security"))',
] }

[workspace]
members = ["examples"]
# 日常命令仅作用于主 crate；examples 只参与 workspace 级操作
default-members = ["."]

# 依赖集中管理：主 crate 与 examples 的重复依赖在此声明，成员用 workspace = true
[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1.53", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tempfile = { version = "3.27", default-features = false, features = ["getrandom"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
inklog = { version = "0.3.0-rc.12", default-features = false }
unic-langid = { version = "0.9", default-features = false }
limiteron = { version = "0.3.0-rc.10", default-features = false, features = ["retry"] }
sys-locale = { version = "0.3", default-features = false }
lbug = { version = "0.22", default-features = false }
