[package]
name = "codenexus"
version = "0.4.0-rc.1"
edition = "2021"
rust-version = "1.97.1"
description = "A queryable code knowledge graph tool built on LadybugDB and tree-sitter"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "MIT"
repository = "https://github.com/Kirky-X/codenexus"
readme = "README.md"
keywords = ["code-analysis", "knowledge-graph", "tree-sitter", "ladybugdb", "code-indexing"]
categories = ["command-line-utilities", "development-tools", "parsing"]
homepage = "https://github.com/Kirky-X/codenexus"
documentation = "https://github.com/Kirky-X/codenexus#readme"
build = "build.rs"

[lib]
name = "codenexus"
path = "src/lib.rs"

[[bin]]
name = "codenexus"
path = "src/main.rs"
# 主 bin 使用 cli 门控的 sdforge/clap——声明 required-features 使
# minimal 等无 cli 组合跳过 bin 编译（此前为 26 个 unresolved 错误）。
required-features = ["cli"]

[[bin]]
name = "codenexus-verify"
path = "tools/verification/src/main.rs"
# verify 工具经 lib 的 `pub use sdforge`（cli 门控）取 clap——未开 cli 时该 bin
# 无法编译；此前缺 required-features 导致 `--no-default-features` 构建必失败
#（CI 一直用 --lib 编译而未暴露）。
required-features = ["cli"]

[features]
default = ["full"]
minimal = ["lang-rust"]
core = ["lang-c", "lang-rust", "lang-python"]
full = ["core", "lang-fortran", "lang-typescript", "lang-go", "lang-java", "lang-cpp", "lang-javascript", "lang-ruby", "lang-haskell", "lang-ocaml", "lang-scala", "lang-php", "lang-csharp", "lang-bash", "lang-html", "lang-css", "lang-json", "lang-regex", "lang-verilog", "daemon", "analysis", "complexity", "api-review", "community", "cross-service", "diagram", "lsp", "cli", "mcp", "cache", "embeddings", "i18n", "hub"]
lang-c = ["dep:tree-sitter-c"]
lang-rust = ["dep:tree-sitter-rust"]
lang-fortran = ["dep:tree-sitter-fortran"]
lang-python = ["dep:tree-sitter-python"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-ruby = ["dep:tree-sitter-ruby"]
lang-haskell = ["dep:tree-sitter-haskell"]
lang-ocaml = ["dep:tree-sitter-ocaml"]
lang-scala = ["dep:tree-sitter-scala"]
lang-php = ["dep:tree-sitter-php"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-bash = ["dep:tree-sitter-bash"]
lang-html = ["dep:tree-sitter-html"]
lang-css = ["dep:tree-sitter-css"]
lang-json = ["dep:tree-sitter-json"]
lang-regex = ["dep:tree-sitter-regex"]
lang-verilog = ["dep:tree-sitter-verilog"]
# 向量嵌入（ML embeddings，ort/tokenizers）；原名单 `embed` 易与 no-std 语境的 embedded 混淆
embeddings = ["dep:reqwest", "dep:ort", "dep:tokenizers", "dep:ndarray"]
daemon = ["dep:notify", "dep:notify-debouncer-full", "dep:signal-hook"]
analysis = []
api-review = ["analysis"]
community = ["analysis", "dep:petgraph"]
cross-service = ["analysis"]
complexity = ["analysis"]
diagram = ["analysis"]
lsp = ["dep:lsp-types", "dep:lsp-server", "dep:crossbeam-channel", "dep:url"]
mcp = ["dep:sdforge", "sdforge/mcp", "sdforge/inklog", "dep:oxiarc-zstd"]
cli = ["dep:sdforge", "sdforge/cli", "sdforge/inklog", "dep:oxiarc-zstd"]
cache = ["dep:oxcache"]
i18n = ["dep:icu_normalizer", "dep:icu_casemap"]
hub = ["dep:reqwest"]

[dependencies]
trait-kit = { version = "0.5.0-rc.6", default-features = false, features = ["async", "lifecycle", "health", "shutdown"] }
lbug = { workspace = true }
tree-sitter = "0.27"
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-fortran = { version = "0.6", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-haskell = { version = "0.23", optional = true }
tree-sitter-ocaml = { version = "0.26", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-regex = { version = "0.25", optional = true }
tree-sitter-verilog = { version = "1.0", optional = true }
rayon = "1.12"
ignore = "0.4"
notify = { version = "8.2", optional = true }
notify-debouncer-full = { version = "0.7", optional = true }
signal-hook = { version = "0.4", optional = true }
blake3 = { version = "1.8", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls"], optional = true }
ort = { version = "2.0.0-rc.13", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
ndarray = { version = "0.17", optional = true }
thiserror = "2.0"
anyhow = "1.0"
pest = "2.9"
pest_derive = "2.9"
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = "1.4"
tempfile = { workspace = true }
lz4_flex = "0.14"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
uuid = { version = "1.26", features = ["v7"] }
petgraph = { version = "0.8", default-features = false, optional = true }
lsp-types = { version = "0.97", optional = true }
lsp-server = { version = "0.10", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
url = { version = "2.5", optional = true }
sdforge = { version = "0.5.0-rc.5", default-features = false, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
oxcache = { version = "0.5.0-rc.5", default-features = false, features = ["minimal", "macros"], optional = true }
oxiarc-zstd = { version = "0.4", default-features = false, optional = true }
inklog = { workspace = true }
regex = "1.13"
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_casemap = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
# Message-level i18n (Fluent bundles + locale detection) — always on, per the
# unify-rust-i18n change. Unrelated to the `i18n` feature above, which gates
# the icu_normalizer/icu_casemap text-processing crates.
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }
sys-locale = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
time = { version = "0.3", features = ["macros"] }
rust_decimal = "1.43"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serial_test = "4.0"
oxiarc-zstd = { version = "0.4", default-features = false }
tracing-subscriber = "0.3"
crossbeam-channel = "0.5"

[build-dependencies]
pkg-config = "0.3"

[[bench]]
name = "index_bench"
harness = false

[[bench]]
name = "query_bench"
harness = false

[[bench]]
name = "trace_bench"
harness = false

[[bench]]
name = "incremental_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "daemon_bench"
harness = false
required-features = ["daemon"]

[[bench]]
name = "graph_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.release.package."*"]
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.test]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"

[lints.rust]
# 2026-09-19 审计：lang-kotlin/solidity/swift 死 cfg 已清理，从 "allow" 收紧为
# warn 级白名单（sdforge 宏会在 consumer 侧发射协议 cfg，白名单声明其合法性），
# 未来再出现悬空 cfg 将直接暴露。
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("http", "openapi", "websocket", "streaming", "grpc", "docs", "cache", "health", "metrics", "security"))',
] }

[workspace]
members = ["examples", "graph-viewer/server"]
# Daily commands (build/test/check) stay scoped to the main crate; examples
# join only for workspace-wide ops (cargo clean --workspace, metadata).
default-members = ["."]

# 依赖集中管理：主 crate 与 workspace 成员（graph-viewer/server、examples）
# 的重复依赖在此声明一次，成员以 `dep = { workspace = true }` 引用，
# 差异 features 在成员侧声明（与 garrison/sinnan 同一惯例）。
[workspace.dependencies]
axum = "0.8"
tokio = "1.53"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tracing = "0.1"
inklog = { version = "0.3.0-rc.5", default-features = false }
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
lbug = "0.20"
