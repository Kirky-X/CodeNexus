[package]
name = "codenexus-graph-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# 生产日志经自研 inklog（crates.io 发布版）；tracing-subscriber 已移除
inklog = { workspace = true }
# Message-level i18n — mirrors codenexus::i18n and embeds the same shared
# locales/{en,zh}/messages.ftl files (see src/i18n.rs). Bridged to sdforge
# i18n (selfdev-lib-adoption-r1): fluent-bundle/unic-langid direct deps
# removed, sys-locale stays for the detection chain.
sdforge = { version = "0.5.0-rc.5", default-features = false, features = ["i18n"] }
sys-locale = { workspace = true }
lbug = { workspace = true }
